[project]
name = "netsentinel-ai"
version = "0.8.0"
description = "Leakage-aware ML research on network-flow intrusion detection, plus a local, detection-only behaviour-baseline and protocol-identification tool for PCAP/Zeek captures."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"   # local is pinned to 3.12 by .python-version
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.20",
    "pyarrow>=17",
    "pandera[polars]>=0.22",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.8",
    "joblib>=1.4",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.urls]
Repository = "https://github.com/Apostal322/NetSentinel-AI"
Documentation = "https://github.com/Apostal322/NetSentinel-AI/tree/main/docs"

[project.optional-dependencies]
# Torch is unpinned on purpose. On Colab, pip keeps the preinstalled build.
torch = ["torch>=2.8"]
dashboard = ["streamlit>=1.40"]

[project.scripts]
netsentinel = "netsentinel.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netsentinel"]

# GTX 1050 Ti (sm_61) + driver 560 -> CUDA 12.6 builds only.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
# Security: Pillow < 13 has 9 advisories published 2026-10-20 (e.g. GHSA-8g5g-8vmr-9782), fixed only
# in 13.0.0, while every streamlit release so far (1.66.0) caps pillow<13. Override the cap; the
# dashboard AppTest covers streamlit with Pillow 13. Remove when streamlit allows Pillow 13.
override-dependencies = ["pillow>=13.0.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not slow and not gpu and not data'"
markers = [
    "slow: longer than a few seconds",
    "gpu: needs a CUDA device",
    "data: needs the real dataset under data/",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # report tables / long format strings
