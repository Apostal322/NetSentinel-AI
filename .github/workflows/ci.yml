name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dashboard   # no torch (CPU-light); dashboard for AppTest
      - run: uv run --extra dashboard ruff check .
      - run: uv run --extra dashboard ruff format --check .
      - run: uv run --extra dashboard pytest             # gpu/slow/data tests are excluded by default

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t netsentinel:ci .
      - name: CLI runs in the image
        run: docker run --rm netsentinel:ci --help
      - name: API starts without a bundle (health ok, ready 503)
        run: |
          docker run -d --name ns -p 127.0.0.1:8000:8000 netsentinel:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)" = "503"
          docker logs ns
          docker rm -f ns
      - uses: astral-sh/setup-uv@v6
      - name: Build demo artifacts on the runner (synthetic, offline)
        run: |
          uv sync --locked
          uv run netsentinel demo --workspace /tmp/demo --quiet --json > /tmp/demo.json
          python3 - <<'PY'
          import json, os, shutil
          d = json.load(open("/tmp/demo.json"))
          os.makedirs("/tmp/models", exist_ok=True)
          for key, name in (("bundle", "bundle"), ("calibration", "cal"), ("classifier", "appid")):
              shutil.copytree(d[key], f"/tmp/models/{name}")
          shutil.copytree(d["bundle"], "/tmp/models/tampered")
          print(json.dumps({k: d[k] for k in ("bundle", "calibration", "classifier")}))
          PY
          f=$(ls /tmp/models/tampered/*.joblib | head -1); printf 'x' >> "$f"
          chmod -R a+rX /tmp/models
      - name: Model-backed API in the container (ready, schema, safe defaults, incidents)
        run: |
          fail() { echo "::error::$1"; docker logs nsm 2>&1 | tail -15 | sed 's/^/::error::log: /'; exit 1; }
          docker run -d --name nsm -p 127.0.0.1:8001:8000 -v /tmp/models:/models:ro             -e NETSENTINEL_CALIBRATION=/models/cal -e NETSENTINEL_APPID=/models/appid             -e NETSENTINEL_ADMIN_TOKEN=ci-only-token netsentinel:ci
          for i in $(seq 1 45); do curl -fs http://127.0.0.1:8001/ready >/dev/null && break; sleep 2; done
          B=http://127.0.0.1:8001
          r=$(curl -s $B/ready); echo "$r" | grep -q '"ready"' || fail "ready: $r"
          r=$(curl -s $B/baseline); echo "$r" | grep -q '"calibration_id":"calibration-' || fail "baseline: ${r:0:300}"
          r=$(curl -s -X POST $B/predict/flow -H 'content-type: application/json'             -d '{"timestamp":"2025-10-09T09:20:00","dst_port":443,"protocol":6,"flow_duration":120,"features":{"in_bytes":900,"out_bytes":4000}}')
          echo "$r" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['threat_status']=='unverified_domain' and d['verdict'] in ('benign','unusual','insufficient_data'); assert {'model_versions','missing_features','evidence'} <= set(d)" || fail "predict: ${r:0:300}"
          r=$(curl -s "$B/incidents?limit=5"); echo "$r" | grep -q '"total":0' || fail "incidents: ${r:0:300}"
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/incidents/x/status -H 'content-type: application/json' -d '{"status":"resolved"}')
          [ "$c" = "401" ] || fail "status without token: $c"
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/incidents/x/status -H 'content-type: application/json' -H 'x-admin-token: ci-only-token' -d '{"status":"resolved"}')
          [ "$c" = "404" ] || fail "status with token on unknown incident: $c"
          docker logs nsm 2>&1 | tail -5
      - name: Tampered bundle is refused (ready 503)
        run: |
          docker run -d --name nst -p 127.0.0.1:8002:8000 -v /tmp/models/tampered:/models/bundle:ro netsentinel:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8002/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8002/ready)" = "503"
          docker logs nst 2>&1 | tail -5
      - name: Clean up containers
        if: always()
        run: docker rm -f ns nsm nst 2>/dev/null || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Dependency vulnerability scan
        run: uv export --locked --no-hashes --no-emit-project > requirements.txt && uvx pip-audit -r requirements.txt
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
