# Ingest settings for the NetFlow v3 archives (see nf_v3.yaml for provenance/integrity).
# utc_offset_hours converts FLOW_START_MILLISECONDS (UTC epoch) to naive local capture time.
#   CSE-CIC-IDS2018: UNB, Fredericton NB, February 2018 -> AST, UTC-4. Checked: the first
#     flow (1518611287705 ms) is 08:28:07 local, the same minute the CIC CSV for 2018-02-14
#     starts after our 12-hour-clock correction.
#   UNSW-NB15: UNSW Canberra Cyber Range, Jan/Feb 2015 -> AEDT, UTC+11 (assumption, see
#     docs/datasets/nf_v3.md for the hour-of-day check).
# family_map: canonical attack label -> coarse family shared ACROSS datasets for transfer
# analysis. Labels missing here get family "unmapped" (warned at ingest, never silently mixed).
datasets:
  nf-unsw-nb15-v3:
    archive: data/raw/nf_v3/NF-UNSW-NB15-v3.zip
    out_dir: data/interim/nf_unsw_nb15_v3
    utc_offset_hours: 11
    family_map:
      exploits: exploit
      fuzzers: fuzzing
      generic: generic
      reconnaissance: recon
      dos: dos
      analysis: recon
      backdoor: exploit
      shellcode: exploit
      worms: exploit
  nf-cicids2018-v3:
    archive: data/raw/nf_v3/NF-CICIDS2018-v3.zip
    out_dir: data/interim/nf_cicids2018_v3
    utc_offset_hours: -4
    # Labels from scripts/nf_label_scan.py (14 attack types); renamed to the CIC canonical
    # labels so CIC- and NF-based IDS2018 results are label-aligned.
    label_map:
      ddos_attack_hoic: ddos_hoic
      ddos_attacks_loic_http: ddos_loic_http
      ddos_attack_loic_udp: ddos_loic_udp
      dos_attacks_slowhttptest: dos_slowhttptest
      dos_attacks_hulk: dos_hulk
      dos_attacks_goldeneye: dos_goldeneye
      dos_attacks_slowloris: dos_slowloris
      brute_force_web: web_bruteforce
      brute_force_xss: web_xss
      sql_injection: web_sql_injection
      infilteration: infiltration
    family_map:
      ftp_bruteforce: bruteforce
      ssh_bruteforce: bruteforce
      dos_goldeneye: dos
      dos_slowloris: dos
      dos_slowhttptest: dos
      dos_hulk: dos
      ddos_loic_http: ddos
      ddos_loic_udp: ddos
      ddos_hoic: ddos
      web_bruteforce: web_attack
      web_xss: web_attack
      web_sql_injection: web_attack
      infiltration: infiltration
      bot: botnet
