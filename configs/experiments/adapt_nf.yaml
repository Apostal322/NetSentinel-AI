# Missions 2-3: label-free adaptation and target normal modelling (see training/adapt.py).
experiment: adapt_nf
seed: 42
feature_set: nf_flow_ctx
target_fpr: 0.001
max_train_rows: 300000
calibration_sizes: [100, 1000, 10000, 50000]
detectors: [robust_z, iforest, autoencoder]
source:
  processed_dir: data/processed/nf_cicids2018_v3
  drop_labels: [infiltration]
  clean_labels: 2
target:
  processed_dir: data/processed/nf_unsw_nb15_v3
  drop_labels: []
  clean_labels: 0
source_split:
  protocol: episode
  block_minutes: 30
  purge_seconds: 150
  fractions: [0.6, 0.2, 0.2]
target_split:
  protocol: chronological   # calibration pool strictly precedes evaluation
  purge_seconds: 150
  fractions: [0.6, 0.2, 0.2]
model_params: {}
runs_dir: runs
