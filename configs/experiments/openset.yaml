# Experiment 6 / H4: leave-one-attack-family-out.
experiment: openset
seed: 42
feature_set: flow
model: lightgbm
target_fpr: 0.001
max_train_rows: 300000
max_benign_train_rows: 100000
holdout_families: [bruteforce, dos, ddos, web_attack, botnet]
anomaly: {kind: iforest, conditioned: false}
data:
  processed_dir: data/processed/ids2018_v1
  days: null
  drop_labels: [infiltration]
  clean_labels: true
split:
  protocol: episode
  block_minutes: 30
  purge_seconds: 150
  fractions: [0.6, 0.2, 0.2]
model_params: {}
runs_dir: runs
